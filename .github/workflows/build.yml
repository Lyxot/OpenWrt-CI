name: OpenWrt-CI

on:
  workflow_dispatch:
    inputs:
      enable_debug:
        description: 'Enable Debug Session'
        required: false
        type: boolean
        default: false
      rebuild_toolchain:
        description: 'Ignore the existing tools and toolchain caches'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 20 * * 0'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openwrt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPOSITORY: immortalwrt/immortalwrt
  UPSTREAM_REF: master
  TARGET_DIR: bin/targets/x86/64
  DOWNLOAD_JOBS: 16
  TOOLS_CACHE_VERSION: v1
  TOOLCHAIN_CACHE_VERSION: v2
  CCACHE_MAX_SIZE: 2G
  SCCACHE_CACHE_SIZE: 1G
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 15

jobs:
  check_update:
    name: Check Update
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.check_update.outputs.current }}
      latest: ${{ steps.check_update.outputs.latest }}
      release_tag: ${{ steps.check_update.outputs.release_tag }}
      cache_epoch: ${{ steps.check_update.outputs.cache_epoch }}
    steps:
      - name: Check
        id: check_update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current=""
          asset_url="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '.assets[] | select(.name == "fw.json") | .browser_download_url' \
            2>/dev/null | head -n1 || true)"
          if [ -n "$asset_url" ]; then
            current="$(curl --fail --location --retry 3 --silent --show-error "$asset_url" \
              | jq -r '.source_sha // empty' || true)"
          fi

          latest="$(gh api "repos/$UPSTREAM_REPOSITORY/commits/$UPSTREAM_REF" --jq '.sha')"
          if ! release_tag="$(gh api "repos/$UPSTREAM_REPOSITORY/releases/latest" \
            --jq '.tag_name' 2>/dev/null)"; then
            release_tag="$(gh api "repos/$UPSTREAM_REPOSITORY/tags" --jq '.[0].name')"
          fi
          [ -n "$release_tag" ] || { echo "Unable to resolve upstream release tag" >&2; exit 1; }
          cache_epoch="$(date -u +%G-%V)"
          {
            echo "current=$current"
            echo "latest=$latest"
            echo "release_tag=$release_tag"
            echo "cache_epoch=$cache_epoch"
          } | tee -a "$GITHUB_OUTPUT"

  build_toolchain:
    name: Build OpenWrt Tools and Toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    needs: check_update
    if: needs.check_update.outputs.current != needs.check_update.outputs.latest || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    outputs:
      tools_cache_key: ${{ steps.tools_key.outputs.cache_key }}
      tools_id: ${{ steps.tools_key.outputs.tools_id }}
      cache_key: ${{ steps.toolchain_key.outputs.cache_key }}
      toolchain_id: ${{ steps.toolchain_key.outputs.toolchain_id }}
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          curl --fail --location --retry 3 --show-error \
            https://build-scripts.immortalwrt.org/init_build_environment.sh \
            | sudo -E bash
          sudo env DEBIAN_FRONTEND=noninteractive dpkg --configure -a
          sudo apt-get clean

      - name: Checkout OpenWrt
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ needs.check_update.outputs.latest }}

      - name: Checkout CI configuration
        uses: actions/checkout@v7
        with:
          path: CI

      - name: Prepare configuration
        run: bash CI/prepare-openwrt.sh CI '${{ needs.check_update.outputs.release_tag }}'

      - name: Calculate tools cache key
        id: tools_key
        shell: bash
        run: |
          set -euo pipefail
          tools_source_hash="$(
            git ls-tree -r HEAD -- Makefile config include scripts tools \
              | sha256sum | cut -c1-16
          )"
          tools_config_hash="$({
            grep -E '^(CONFIG_(TARGET|CPU|ARCH|CCACHE|SDK|DWARVES|BUILD_ALL_HOST_TOOLS|GCC_USE_GRAPHITE|EFI_IMAGES|GRUB_EFI_IMAGES|USE_MOLD|USE_LLVM_BUILD|TARGET_INITRAMFS_COMPRESSION|BRCMSMAC)|CONFIG_PACKAGE_kmod-b43)' .config
          } | sha256sum | cut -c1-16)"
          tools_id="$RUNNER_OS-openwrt-tools-x86_64-$tools_source_hash-$tools_config_hash-$TOOLS_CACHE_VERSION"
          cache_key="$tools_id"
          if [ "${{ github.event.inputs.rebuild_toolchain }}" = "true" ]; then
            cache_key="$cache_key-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          {
            echo "tools_id=$tools_id"
            echo "cache_key=$cache_key"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Restore tools cache
        id: tools_cache
        uses: actions/cache/restore@v6
        with:
          path: staging_dir/host*
          key: ${{ steps.tools_key.outputs.cache_key }}

      - name: Compile host tools
        if: steps.tools_cache.outputs.cache-hit != 'true'
        run: make -j"$(nproc)" tools/install || make -j1 V=s tools/install

      - name: Verify host tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in ccache cmake fakeroot mkhash mksquashfs4 ninja pkg-config; do
            [ -x "staging_dir/host/bin/$tool" ] || { echo "Missing host tool: $tool" >&2; exit 1; }
          done
          tools_stamp="$(find staging_dir/host -maxdepth 1 -type f -name '.tools_compile*' -print -quit)"
          [ -n "$tools_stamp" ] || { echo "Missing host tools completion stamp" >&2; exit 1; }
          echo "Verified host tools: $tools_stamp"
          du -sh staging_dir/host*

      - name: Save tools cache
        if: steps.tools_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: staging_dir/host*
          key: ${{ steps.tools_key.outputs.cache_key }}

      - name: Use prepared host tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in ccache cmake fakeroot mkhash mksquashfs4 ninja pkg-config; do
            [ -x "staging_dir/host/bin/$tool" ] || { echo "Missing host tool: $tool" >&2; exit 1; }
          done
          sed -i 's/ $(tools\/stamp-compile)//g' Makefile

      - name: Calculate toolchain cache key
        id: toolchain_key
        shell: bash
        run: |
          set -euo pipefail
          toolchain_source_hash="$(
            git ls-tree -r HEAD -- \
              Makefile config include scripts toolchain \
              target/linux/generic/kernel-version.mk \
              target/linux/x86/Makefile \
              | sha256sum | cut -c1-16
          )"
          toolchain_config_hash="$({
            grep -E '^(CONFIG_(TARGET|CPU|ARCH|TOOLCHAIN|GCC|BINUTILS|LIBC|MUSL|BPF_TOOLCHAIN|HOST_|OPTIMIZE_HOST_TOOLS|USE_MUSL|USE_GLIBC|USE_UCLIBC|USE_LTO|USE_MOLD|USE_GC_SECTIONS|USE_STRIP|USE_SSTRIP|TARGET_OPTIMIZATION|EXTRA_OPTIMIZATION|PKG_ASLR|PKG_CC_STACKPROTECTOR|KERNEL_CC_STACKPROTECTOR|PKG_FORTIFY|PKG_RELRO|PKG_DT_RELR))' .config
          } | sha256sum | cut -c1-16)"
          toolchain_id="$RUNNER_OS-openwrt-toolchain-x86_64-${{ steps.tools_key.outputs.tools_id }}-$toolchain_source_hash-$toolchain_config_hash-$TOOLCHAIN_CACHE_VERSION"
          cache_key="$toolchain_id"
          if [ "${{ github.event.inputs.rebuild_toolchain }}" = "true" ]; then
            cache_key="$cache_key-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          {
            echo "toolchain_id=$toolchain_id"
            echo "cache_key=$cache_key"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Restore toolchain cache
        id: toolchain_cache
        uses: actions/cache/restore@v6
        with:
          path: staging_dir/toolchain-*
          key: ${{ steps.toolchain_key.outputs.cache_key }}

      - name: Compile target toolchain
        if: steps.toolchain_cache.outputs.cache-hit != 'true'
        run: make -j"$(nproc)" toolchain/install || make -j1 V=s toolchain/install

      - name: Verify target toolchain
        shell: bash
        run: |
          set -euo pipefail
          configured_version="$(sed -n 's/^CONFIG_GCC_VERSION="\([^"]*\)"/\1/p' .config)"
          compiler="$(find staging_dir -path "*/toolchain-*_gcc-${configured_version}_*/bin/*-gcc" -type f -print -quit)"
          [ -n "$compiler" ] && [ "$("$compiler" -dumpfullversion)" = "$configured_version" ]
          echo "Verified GCC $configured_version: $compiler"
          du -sh staging_dir/toolchain-*

      - name: Save toolchain cache
        if: steps.toolchain_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: staging_dir/toolchain-*
          key: ${{ steps.toolchain_key.outputs.cache_key }}

  build_openwrt:
    name: Build OpenWrt Firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    needs:
      - check_update
      - build_toolchain
    if: needs.check_update.outputs.current != needs.check_update.outputs.latest || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    env:
      TZ: Asia/Shanghai
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          curl --fail --location --retry 3 --show-error \
            https://build-scripts.immortalwrt.org/init_build_environment.sh \
            | sudo -E bash
          sudo env DEBIAN_FRONTEND=noninteractive dpkg --configure -a
          sudo apt-get install --yes --no-install-recommends qemu-utils sccache
          sudo apt-get clean

      - name: Checkout OpenWrt
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ needs.check_update.outputs.latest }}

      - name: Checkout CI configuration
        uses: actions/checkout@v7
        with:
          path: CI

      - name: Prepare configuration
        run: bash CI/prepare-openwrt.sh CI '${{ needs.check_update.outputs.release_tag }}'

      - name: Restore required host tools
        uses: actions/cache/restore@v6
        with:
          path: staging_dir/host*
          key: ${{ needs.build_toolchain.outputs.tools_cache_key }}
          fail-on-cache-miss: true

      - name: Restore required toolchain
        uses: actions/cache/restore@v6
        with:
          path: staging_dir/toolchain-*
          key: ${{ needs.build_toolchain.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Use restored tools and toolchain
        shell: bash
        run: |
          set -euo pipefail
          for tool in ccache cmake fakeroot mkhash mksquashfs4 ninja pkg-config; do
            [ -x "staging_dir/host/bin/$tool" ] || { echo "Missing host tool: $tool" >&2; exit 1; }
          done
          configured_version="$(sed -n 's/^CONFIG_GCC_VERSION="\([^"]*\)"/\1/p' .config)"
          compiler="$(find staging_dir -path "*/toolchain-*_gcc-${configured_version}_*/bin/*-gcc" -type f -print -quit)"
          [ -n "$compiler" ] && [ "$("$compiler" -dumpfullversion)" = "$configured_version" ]
          echo "Using cached GCC $configured_version: $compiler"
          sed -i 's/ $(tools\/stamp-compile)//g' Makefile
          sed -i 's/ $(toolchain\/stamp-compile)//g' Makefile
          sed -i 's/ $(toolchain\/stamp-install)//g' Makefile

      - name: Restore compiler cache
        id: ccache_restore
        uses: actions/cache/restore@v6
        with:
          path: |
            .ccache
            .sccache
          key: ${{ needs.build_toolchain.outputs.toolchain_id }}-ccache-${{ needs.check_update.outputs.cache_epoch }}
          restore-keys: |
            ${{ needs.build_toolchain.outputs.toolchain_id }}-ccache-

      - name: Configure compiler cache
        run: |
          mkdir -p "$CCACHE_DIR" "$SCCACHE_DIR"
          staging_dir/host/bin/ccache --max-size "$CCACHE_MAX_SIZE"
          staging_dir/host/bin/ccache --set-config compression=true
          staging_dir/host/bin/ccache --set-config compression_level=6
          staging_dir/host/bin/ccache --zero-stats
          sccache --start-server
          sccache --zero-stats

      - name: Setup Debug Session
        if: github.event.inputs.enable_debug == 'true'
        uses: mxschmitt/action-tmate@v3

      - name: Download packages
        run: |
          python3 CI/setmirrors.py scripts/projectsmirrors.json
          make download -j"$DOWNLOAD_JOBS" || make download V=s -j4

      - name: Patch
        shell: bash
        run: |
          set -euo pipefail

          board="$(sed -n 's/^CONFIG_TARGET_BOARD="\([^"]*\)"/\1/p' .config)"
          subtarget="$(sed -n 's/^CONFIG_TARGET_SUBTARGET="\([^"]*\)"/\1/p' .config)"
          if [ "$board" = "x86" ]; then
            kernel_config="$(find "target/linux/$board/$subtarget" -maxdepth 1 \
              -type f -name 'config-*' -print -quit)"
            [ -n "$kernel_config" ] || { echo "Unable to find kernel configuration" >&2; exit 1; }
            grep -q '^# CONFIG_X86_SGX is not set$' "$kernel_config" \
              || printf '%s\n' '# CONFIG_X86_SGX is not set' >> "$kernel_config"
          fi

          ota_dir="$(readlink -f package/feeds/smpackage/luci-app-ota)"
          install -d "$ota_dir/root/etc/config"
          cat > "$ota_dir/root/etc/config/ota" <<EOF

          config ota 'config'
                  option api_url 'https://github.com/$GITHUB_REPOSITORY/releases/latest/download/fw.json'
          EOF
          sed -i -E 's/(^|[[:space:]])curl[[:space:]]+/\1curl -L /g' "$ota_dir/root/bin/ota"

      - name: Compile OpenWrt
        run: make -j"$(nproc)" || make V=s -j1

      - name: Report compiler cache
        if: always()
        run: |
          staging_dir/host/bin/ccache --show-stats || true
          sccache --show-stats || true
          sccache --stop-server || true

      - name: Save compiler cache
        if: always() && steps.ccache_restore.outcome == 'success' && steps.ccache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .ccache
            .sccache
          key: ${{ needs.build_toolchain.outputs.toolchain_id }}-ccache-${{ needs.check_update.outputs.cache_epoch }}

      - name: Clean up
        run: |
          ls "$TARGET_DIR"
          df -h

      - name: Upload buildinfo
        uses: actions/upload-artifact@v7
        with:
          name: OpenWrt_buildinfo
          path: ./bin/targets/x86/64/*.buildinfo
          if-no-files-found: error
          retention-days: 7

      - name: Upload ext4 images
        uses: actions/upload-artifact@v7
        with:
          name: OpenWrt_ext4_images
          path: |
            ./bin/targets/x86/64/immortalwrt-x86-64-generic-ext4-combined-efi.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload squashfs images
        uses: actions/upload-artifact@v7
        with:
          name: OpenWrt_squashfs_images
          path: |
            ./bin/targets/x86/64/immortalwrt-x86-64-generic-squashfs-combined-efi.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload rootfs
        uses: actions/upload-artifact@v7
        with:
          name: OpenWrt_rootfs
          path: ./bin/targets/x86/64/immortalwrt-x86-64-generic-rootfs.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Prepare release
        run: |
          mkdir -p release
          cat > release/fw.json <<EOF
          {
            "source_sha": "${{ needs.check_update.outputs.latest }}",
            "x86_64": [
              {
                "build_date": "$(./scripts/get_source_date_epoch.sh)",
                "sha256sum": "$(sha256sum bin/targets/x86/64/immortalwrt-x86-64-generic-squashfs-combined-efi.img.gz | awk '{print $1}')",
                "url": "https://github.com/$GITHUB_REPOSITORY/releases/download/${{ needs.check_update.outputs.release_tag }}/immortalwrt-x86-64-generic-squashfs-combined-efi.img.gz"
              }
            ]
          }
          EOF
          cat release/fw.json
          echo "**Update Time**: $(date -d @$(./scripts/get_source_date_epoch.sh) -Iseconds)" > changelog.md
          if [ -n "${{ needs.check_update.outputs.current }}" ]; then
            echo "**Full Changelog**: https://github.com/$UPSTREAM_REPOSITORY/compare/${{ needs.check_update.outputs.current }}...${{ needs.check_update.outputs.latest }}" >> changelog.md
          else
            echo "**Source Commit**: https://github.com/$UPSTREAM_REPOSITORY/commit/${{ needs.check_update.outputs.latest }}" >> changelog.md
          fi
          cat changelog.md
          mv ./bin/targets/x86/64/immortalwrt-x86-64-generic-ext4-combined-efi.* release/
          mv ./bin/targets/x86/64/immortalwrt-x86-64-generic-squashfs-combined-efi.* release/
          mv ./bin/targets/x86/64/immortalwrt-x86-64-generic-rootfs.tar.gz release/

      - name: Release
        uses: ncipollo/release-action@v1
        if: github.ref_name == 'main' && github.event_name != 'pull_request'
        with:
          allowUpdates: true
          bodyFile: changelog.md
          removeArtifacts: true
          tag: ${{ needs.check_update.outputs.release_tag }}
          makeLatest: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: release/*

      - name: Prepare commit
        run: |
          sed -i -E \
            -e '/^#? *CONFIG_BINUTILS_USE_VERSION_/d' \
            -e '/^#? *CONFIG_GCC_USE_VERSION_/d' \
            -e '/^CONFIG_BINUTILS_VERSION/d' \
            -e '/^CONFIG_GCC_VERSION/d' \
            -e '/^CONFIG_VERSION_/d' \
            .config
          cp .config CI/

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Update .config
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          title: Update .config
          body: Update .config
          path: CI
          add-paths: .config
          branch: update-config
